# Kör appen i en lokal container mot PRODUKTIONS-DB (Supabase).
#
#   docker compose -f docker-compose.prod-db.yml up --build
#   -> http://localhost:8081
#
# DATABASE_URL och BETTER_AUTH_SECRET läses från .env.production (ej i git).
# Ingen db- eller migrate-tjänst här med flit: inget migreras automatiskt
# mot produktion. Kör migrering manuellt om du verkligen vill det.
# Eget projektnamn så att den här stacken inte krockar med docker-compose.yml.
name: time-report-proddb

services:
  app:
    build:
      context: .
    image: time-report:prod-db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Vinner över .env.production.
      NODE_ENV: production
      PORT: 8080
      BETTER_AUTH_URL: http://localhost:${APP_PORT:-8081}
    ports:
      - "${APP_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
