services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: timereport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timereport}
      POSTGRES_DB: timereport
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timereport -d timereport"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: backend-build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://timereport:${POSTGRES_PASSWORD:-timereport}@db:5432/timereport
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  app:
    build: .
    image: time-report:node
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://timereport:${POSTGRES_PASSWORD:-timereport}@db:5432/timereport
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET to at least 32 random characters}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      NODE_ENV: production
      PORT: 8080

volumes:
  postgres-data:
